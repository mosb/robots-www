<head>
  <link href="https://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices (zoom no longer disabled) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Adobe Fonts (legacy Typekit kit; still resolves over https) -->
  <script type="text/javascript" src="https://use.typekit.net/flp8eda.js"></script>
  <script type="text/javascript">try{Typekit.load();}catch(e){}</script>

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- CSS -->
  <link href="{{ site.baseurl }}/public/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/poole.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/hyde.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/syntax.css">
  <link href="{{ site.baseurl }}/public/css/mosb.css" rel="stylesheet">

  <!-- jQuery + Bootstrap 3 (jQuery pinned, was an unversioned 'latest' URL) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{{ site.baseurl }}/public/js/bootstrap.min.js"></script>

  <!-- MathJax 3 (the old cdn.mathjax.org host was retired years ago) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script id="MathJax-script" async
          src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Icons -->
  <link rel="shortcut icon" href="{{ site.baseurl }}/public/ico/favicon.ico">

  <!-- RSS: only keep this if /atom.xml actually exists (needs the jekyll-feed
       gem). The path is baseurl-aware so it resolves under /~mosb. -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ site.baseurl }}/atom.xml">
</head>
